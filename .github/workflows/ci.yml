# Builds every image and runs the structure tests on pull requests and
# pushes. On main (a push, the weekly schedule, which rebuilds the images
# with their distributions' updates, or a run by hand) it also publishes
# the tested images to GHCR, as ghcr.io/ghostrack-io/<name>:<version> and
# :<version>-<YYYYMMDD>-<n>, and attaches images.json (the references by
# the digests pushed) to a release images-<YYYYMMDD>-<n>, the same n. The
# boot test (tests/boot.sh) needs KVM and a kernel-linux build, and does
# not run here.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
      publish: ${{ steps.list.outputs.publish }}
      date: ${{ steps.number.outputs.date }}
      number: ${{ steps.number.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the scripts
        run: shellcheck -x scripts/*.sh tests/*.sh common/*.sh images/alpine/*.sh
      - name: List the images
        id: list
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
        run: |
          repo=$PWD
          . scripts/lib.sh
          tsv=$(images_tsv)
          images=$(cut -f1,2 <<< "${tsv}" | tr '\t' ':' | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
      # The release and the dated tags of a publish share its number n: one
      # more than the highest of the day's release tags, so a dated tag
      # that a release names is never pushed again.
      - name: Number the publish
        id: number
        if: steps.list.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%Y%m%d)
          highest=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/images-${date}-" \
            --jq "[.[].ref | ltrimstr(\"refs/tags/images-${date}-\") | select(test(\"^[0-9]+\$\")) | tonumber] | max // 0")
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "number=$((highest + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    env:
      SELECTED: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: scripts/build.sh "$SELECTED"
      - name: Structure tests
        run: tests/structure.sh "$SELECTED"
      - name: Save the tested image
        id: save
        if: needs.prepare.outputs.publish == 'true'
        run: |
          echo "slug=$(tr ':.' '--' <<< "$SELECTED")" >> "$GITHUB_OUTPUT"
          podman save --format oci-archive -o image.tar "localhost/gigahost-images/$SELECTED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.save.outcome == 'success'
        with:
          name: image-${{ steps.save.outputs.slug }}
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    env:
      SELECTED: ${{ matrix.image }}
      DATE: ${{ needs.prepare.outputs.date }}
      NUMBER: ${{ needs.prepare.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the artifact
        id: slug
        run: echo "slug=$(tr ':.' '--' <<< "$SELECTED")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ steps.slug.outputs.slug }}
      - name: Push to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release with this number names its dated tags: they are not
          # pushed again (a later rerun of an older run would move them).
          released=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/images-${DATE}-${NUMBER}" \
            --jq "[.[] | select(.ref == \"refs/tags/images-${DATE}-${NUMBER}\")] | length")
          if [[ ${released} != 0 ]]; then
            echo "images-${DATE}-${NUMBER} is released already; start a new run" >&2
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$REGISTRY_USER" --password-stdin
          name=${SELECTED%%:*}
          version=${SELECTED#*:}
          tag="${version}-${DATE}-${NUMBER}"
          repository="ghcr.io/ghostrack-io/${name}"
          dated="${repository}:${tag}"
          moving="${repository}:${version}"
          skopeo copy --retry-times 3 --digestfile digest oci-archive:image.tar "docker://${dated}"
          skopeo copy --retry-times 3 --preserve-digests "docker://${dated}" "docker://${moving}"
          digest=$(cat digest)
          for reference in "${dated}" "${moving}"; do
            shown=$(skopeo inspect --format '{{.Digest}}' "docker://${reference}")
            [[ ${shown} == "${digest}" ]] || { echo "${reference} is ${shown}, not ${digest}" >&2; exit 1; }
          done
          repo=$PWD
          . scripts/lib.sh
          # The reference is REPOSITORY@DIGEST, which names one image for
          # good; the dated tag is beside it.
          select_images "$SELECTED" | python3 -c '
          import json, sys
          name, version, _family, init, stop, _base, display, memory, level = sys.stdin.read().rstrip("\n").split("\t")
          repository, tag, digest = sys.argv[1:4]
          json.dump({"name": name, "version": version, "display_name": display,
                     "reference": f"{repository}@{digest}", "digest": digest, "tag": tag,
                     "init": init, "stop_signal": int(stop), "ssh_user": "root",
                     "minimum_memory_bytes": int(memory), "x86_64_level": int(level)}, sys.stdout)
          ' "${repository}" "${tag}" "${digest}" > pushed.json
          cat pushed.json
          skopeo logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pushed-${{ steps.slug.outputs.slug }}
          path: pushed.json
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DATE: ${{ needs.prepare.outputs.date }}
      NUMBER: ${{ needs.prepare.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pushed-*
          path: pushed
      - name: Write images.json
        run: |
          set -euo pipefail
          repo=$PWD
          . scripts/lib.sh
          images_tsv | python3 -c '
          import glob, json, sys
          pushed = {}
          for path in glob.glob("pushed/*/pushed.json"):
              entry = json.load(open(path))
              pushed[(entry["name"], entry["version"])] = entry
          images = []
          for line in sys.stdin:
              name, version = line.split("\t")[:2]
              if (name, version) not in pushed:
                  sys.exit(f"{name}:{version} was not pushed")
              images.append(pushed[(name, version)])
          json.dump({"images": images}, open("images.json", "w"), indent=2)
          '
          cat images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images.json
          path: images.json
          if-no-files-found: error
      - name: Release images.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="images-${DATE}-${NUMBER}"
          # gh would attach a release to a tag that exists already, at the
          # commit it names: refuse instead.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
            --jq "[.[] | select(.ref == \"refs/tags/${tag}\")] | length")
          if [[ ${existing} != 0 ]]; then
            echo "${tag} exists already" >&2
            exit 1
          fi
          gh release create "$tag" images.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Images ${DATE} #${NUMBER}" \
            --notes "The stock images built from ${GITHUB_SHA}, by digest, in images.json; their dated tags end in -${DATE}-${NUMBER}."
